<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="50%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)" rx="12"/>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="44" x2="900" y2="44"/>
    <line x1="0" y1="88" x2="900" y2="88"/>
    <line x1="0" y1="132" x2="900" y2="132"/>
    <line x1="0" y1="176" x2="900" y2="176"/>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="900" height="4" fill="url(#accent)" rx="2"/>

  <!-- Chart pattern (decorative candlestick) -->
  <g transform="translate(680, 55)" opacity="0.15">
    <rect x="0" y="20" width="8" height="40" rx="2" fill="#22c55e"/>
    <rect x="4" y="10" width="2" height="62" fill="#22c55e"/>
    
    <rect x="16" y="30" width="8" height="30" rx="2" fill="#ef4444"/>
    <rect x="20" y="22" width="2" height="48" fill="#ef4444"/>
    
    <rect x="32" y="15" width="8" height="45" rx="2" fill="#22c55e"/>
    <rect x="36" y="5" width="2" height="67" fill="#22c55e"/>
    
    <rect x="48" y="35" width="8" height="25" rx="2" fill="#ef4444"/>
    <rect x="52" y="28" width="2" height="42" fill="#ef4444"/>
    
    <rect x="64" y="10" width="8" height="50" rx="2" fill="#22c55e"/>
    <rect x="68" y="0" width="2" height="72" fill="#22c55e"/>

    <!-- Upward trend line -->
    <polyline points="0,70 16,60 32,50 48,55 64,45" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Title -->
  <text x="40" y="68" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#6b7280" letter-spacing="2">AI TRADING ANALYST</text>

  <text x="40" y="118" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" letter-spacing="0.5">
    AI Trading Analyst
  </text>

  <text x="40" y="150" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#9ca3af" letter-spacing="0.3">
    for Hermes Agent
  </text>

  <!-- Divider line -->
  <line x1="40" y1="165" x2="300" y2="165" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>

  <!-- Tagline -->
  <text x="40" y="195" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#6b7280" letter-spacing="0.5">
    Multi-agent stock research · Technical &amp; fundamental analysis · Options &amp; risk · PDF reports
  </text>

  <!-- Badges row -->
  <g transform="translate(40, -8)">
    <rect x="0" y="194" width="90" height="22" rx="4" fill="#1a3d2e" stroke="#22c55e" stroke-width="0.5" opacity="0.8"/>
    <text x="45" y="209" font-family="'Inter', sans-serif" font-size="10" fill="#22c55e" text-anchor="middle" font-weight="bold">16 SKILLS</text>

    <rect x="98" y="194" width="90" height="22" rx="4" fill="#1a2a3d" stroke="#3b82f6" stroke-width="0.5" opacity="0.8"/>
    <text x="143" y="209" font-family="'Inter', sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="bold">5 AGENTS</text>

    <rect x="196" y="194" width="90" height="22" rx="4" fill="#2a1a3d" stroke="#a855f7" stroke-width="0.5" opacity="0.8"/>
    <text x="241" y="209" font-family="'Inter', sans-serif" font-size="10" fill="#a855f7" text-anchor="middle" font-weight="bold">HERMES</text>

    <rect x="294" y="194" width="90" height="22" rx="4" fill="#3d1a1a" stroke="#ef4444" stroke-width="0.5" opacity="0.8"/>
    <text x="339" y="209" font-family="'Inter', sans-serif" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="bold">PDF REPORTS</text>
  </g>

  <!-- Candle glow -->
  <circle cx="720" cy="55" r="60" fill="url(#accent2)" opacity="0.03"/>
</svg>
